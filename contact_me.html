<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Me - Sean Kaeden Martinez</title>
</head>

<body>

    <header>
        <h1>Contact Me</h1>
        <p>Get in touch with me.</p>

        <h3>Check Out My Social Media</h3>
        <p>
            <a href="https://www.facebook.com/kaeden.martinez.3">My Facebook</a>
            <a href="https://instagram.com/kden_.07">My Instagram</a>
        </p>
    </header>

    <h3>Navigation</h3>
    <nav>
        <a href="index.html">Home</a>
        <a href="interests_projects.html">My Interests</a>
        <a href="contact.html">Contact Me</a>
    </nav>

    <h3>Free music while you write your message.</h3>
    <audio controls loop>
        <source src="audio/Elevator_Music.mp3" type="audio/mpeg">
    </audio>

    <main>

        <section>
            <h2>Send Me a Message</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="interest">What are you interested in?</label>
                <select id="interest" name="interest">
                    <option value="combat-sports">Combat Sports</option>
                    <option value="motorcycles">Custom Motorcycles</option>
                    <option value="graphic-design">Graphic Design</option>
                    <option value="cinematography">Cinematography</option>
                    <option value="cinematography">Other</option>
                </select>

                <br><br>

                <label for="message">Message:</label>
                <br>
                <textarea id="message" name="message"></textarea>

                <br><br>

                <input type="submit" value="Submit">
            </form>

        </section>

    </main>

    <footer>
        <p>Sean Kaeden Martinez</p>
    </footer>

</body>

</html>
